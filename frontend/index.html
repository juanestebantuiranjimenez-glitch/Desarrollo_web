<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sistema de gestión académica para facultades, programas y estudiantes de Monsters University."
    />
    <meta name="theme-color" content="#140710" />
    <script>
      try {
        const guardado = localStorage.getItem('admitidos.theme')
        const tema = guardado === 'light' || guardado === 'dark' ? guardado : 'dark'
        document.documentElement.dataset.theme = tema
        document.documentElement.style.colorScheme = tema
        const meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', tema === 'dark' ? '#140710' : '#f7f0e6')
      } catch {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Monsters University | Admisiones</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
